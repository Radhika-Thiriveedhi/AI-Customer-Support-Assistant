<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Customer Support Assistant</title><link rel="stylesheet" href="/static/style.css"></head><body><header><h1>AI Customer Support Assistant</h1><p>Intelligent support automation, document analysis and service analytics.</p></header><main>
<section class="card"><h2>Support Chat</h2><div id="chat"></div><textarea id="message" placeholder="Ask about an order, return, refund, delivery, payment, or account..."></textarea><button onclick="sendMessage()">Send Message</button><button class="secondary" onclick="clearChat()">Clear</button></section>
<section class="grid"><div class="card"><h2>Document Analyzer</h2><textarea id="doc" placeholder="Paste a customer email or support document..."></textarea><button onclick="analyze()">Analyze</button><pre id="analysis"></pre></div><div class="card"><h2>Ticket Classifier</h2><textarea id="ticket" placeholder="Paste a support ticket..."></textarea><button onclick="classifyTicket()">Classify</button><pre id="classification"></pre></div></section>
<section class="card"><h2>Service Analytics</h2><button onclick="loadAnalytics()">Refresh Dashboard</button><pre id="analytics"></pre></section></main><script src="/static/app.js"></script></body></html>
